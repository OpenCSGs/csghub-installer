# Test suite for the label-studio-llm-back Service.
#
# The Service exposes the llm-back port (9090 by default) and selects pods
# by the llm-back service label. Both port and targetPort are derived from
# service.port.

suite: Test Label Studio LLM Back Service
templates:
  - label-studio-llm-back/service.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the llm-back Service metadata and labels
    template: label-studio-llm-back/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-label-studio-llm-back"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "label-studio-llm-back"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "dataflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: "Helm"

  - it: renders the llm-back Service spec with default port
    template: label-studio-llm-back/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.ports[0].port
          value: 9090
      - equal:
          path: spec.ports[0].targetPort
          value: 9090
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "http"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "label-studio-llm-back"
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: "csghub"

  - it: renders a custom port and propagates it to both port and targetPort
    template: label-studio-llm-back/service.yaml
    set:
      labelStudioLlmBack:
        service:
          port: 9191
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9191
      - equal:
          path: spec.ports[0].targetPort
          value: 9191

  - it: renders a NodePort type when service.type is overridden
    template: label-studio-llm-back/service.yaml
    set:
      labelStudioLlmBack:
        service:
          type: "NodePort"
    asserts:
      - equal:
          path: spec.type
          value: "NodePort"
