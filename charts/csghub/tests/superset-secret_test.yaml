# Test suite for the Superset Secret.
#
# The Secret holds the superset env configuration: the secret key, admin
# password, casdoor OIDC client, postgresql target databases and redis. The
# secret key and database passwords are non-deterministic and matched by
# regex. It renders only when superset is enabled.

suite: Test Superset Secret
templates:
  - superset/secret.yaml
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: "v1"
        resource: "secrets"
      namespaced: true
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders nothing when superset is disabled
    template: superset/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Secret metadata with the keep annotation
    template: superset/secret.yaml
    set:
      superset:
        enabled: true
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-superset-env"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: encodes the secret key, admin password and casdoor OIDC client
    template: superset/secret.yaml
    set:
      superset:
        enabled: true
    asserts:
      - matchRegex:
          decodeBase64: true
          path: data.SUPERSET_SECRET_KEY
          pattern: "^[0-9a-f]{56}$"
      - equal:
          decodeBase64: true
          path: data.ADMIN_PASSWORD
          value: "test-admin-password"
      - equal:
          decodeBase64: true
          path: data.CASDOOR_ENDPOINT
          value: "https://casdoor.example.com"
      - matchRegex:
          decodeBase64: true
          path: data.CASDOOR_CLIENT_ID
          pattern: "^[0-9a-f]{20}$"
      - matchRegex:
          decodeBase64: true
          path: data.CASDOOR_CLIENT_SECRET
          pattern: "^[0-9a-f]{40}$"

  - it: encodes the superset postgresql database
    template: superset/secret.yaml
    set:
      superset:
        enabled: true
    asserts:
      - equal:
          decodeBase64: true
          path: data.DB_HOST
          value: "csghub-postgresql"
      - equal:
          decodeBase64: true
          path: data.DB_PORT
          value: "5432"
      - equal:
          decodeBase64: true
          path: data.DB_USER
          value: "csghub"
      - matchRegex:
          decodeBase64: true
          path: data.DB_PASS
          pattern: "^[A-Za-z0-9+/]{32}$"
      - equal:
          decodeBase64: true
          path: data.DB_NAME
          value: "csghub_superset"

  - it: encodes the target server database and redis
    template: superset/secret.yaml
    set:
      superset:
        enabled: true
    asserts:
      - equal:
          decodeBase64: true
          path: data.TARGET_DB_HOST
          value: "csghub-postgresql"
      - equal:
          decodeBase64: true
          path: data.TARGET_DB_PORT
          value: "5432"
      - equal:
          decodeBase64: true
          path: data.TARGET_DB_USER
          value: "csghub"
      - matchRegex:
          decodeBase64: true
          path: data.TARGET_DB_PASS
          pattern: "^[A-Za-z0-9+/]{32}$"
      - equal:
          decodeBase64: true
          path: data.TARGET_DB_NAME
          value: "csghub_server"
      - equal:
          decodeBase64: true
          path: data.REDIS_HOST
          value: "csghub-redis"
      - equal:
          decodeBase64: true
          path: data.REDIS_PORT
          value: "6379"
      - equal:
          decodeBase64: true
          path: data.BUILD_TRANSLATIONS
          value: "true"
      - equal:
          decodeBase64: true
          path: data.SUPERSET_ENABLED_LANGUAGES
          value: "en,zh,zh_TW"
      - equal:
          decodeBase64: true
          path: data.SUPERSET_DEFAULT_LOCALE
          value: "zh"
      - notExists:
          path: data.REDIS_PASSWORD

  # The pre-f718c320 superset-env secret held a random key. Its encrypted dbs
  # rows become unreadable if the key changes, so the first migration must
  # carry the legacy value forward instead of deriving a new one.
  - it: reuses the legacy secret key from superset-env during migration
    template: superset/secret.yaml
    set:
      superset:
        enabled: true
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: csghub-superset-env
            namespace: csghub
          data:
            SUPERSET_SECRET_KEY: bGVnYWN5cmFuZG9tMTIzNDU2Nzg5MGFiY2RlZmdoaWpr
    asserts:
      - equal:
          decodeBase64: true
          path: data.SUPERSET_SECRET_KEY
          value: "legacyrandom1234567890abcdefghijk"

  - it: prefers the master secret key over the legacy superset-env key
    template: superset/secret.yaml
    set:
      superset:
        enabled: true
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: csghub-secrets
            namespace: csghub
          data:
            superset-secret-key: YWFiYmNjZGRlZWZmMDAxMTIyMzM0NDU1NjY3Nzg4OTlhYWJiY2NkZGVlZmYwMDExMjIzMzQ0NTU=
        - kind: Secret
          apiVersion: v1
          metadata:
            name: csghub-superset-env
            namespace: csghub
          data:
            SUPERSET_SECRET_KEY: bGVnYWN5cmFuZG9tMTIzNDU2Nzg5MGFiY2RlZmdoaWpr
    asserts:
      - equal:
          decodeBase64: true
          path: data.SUPERSET_SECRET_KEY
          value: "aabbccddeeff00112233445566778899aabbccddeeff001122334455"
