{{- $service := include "common.service" . | fromYaml }}
{{- $serviceName := include "common.names.custom" (list . $service.name) }}
{{- $knativeNamespace := include "namespace.knative" . }}
{{- $isOpencsgRegistry := include "common.registry.isopencsg" .Values.global.image.registry }}
{{- $knativeRegistry := "" }}
{{- $knativeVersion := "v1.22.3" }}
{{- $ingressType := $service.knative.serving.ingress | default "gateway-api" }}
{{- $gatewayAPI := eq $ingressType "gateway-api" }}
{{- if $isOpencsgRegistry }}
{{- $knativeRegistry = printf "%s/opencsghq/knative-releases/knative.dev" .Values.global.image.registry }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $knativeNamespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/service: {{ $serviceName }}
    {{- if $service.labels }}
      {{- toYaml $service.labels | nindent 4 }}
    {{- end }}
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: operator.knative.dev/v1beta1
kind: KnativeServing
metadata:
  name: knative-serving
  namespace: {{ $knativeNamespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/service: {{ $serviceName }}
    {{- if $service.labels }}
      {{- toYaml $service.labels | nindent 4 }}
    {{- end }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
    {{- $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "knativeservings.operator.knative.dev" }}
    {{- if and .Release.IsUpgrade (not $crd) }}
    helm.sh/hook: post-upgrade
    {{- end }}
    {{- if .Release.IsInstall }}
    helm.sh/hook: post-install
    {{- end }}
spec:
  # https://knative.dev/docs/install/operator/configuring-serving-cr/#configuring-the-knative-serving-operator-custom-resource
  version: {{ regexReplaceAll "\\.[0-9]+$" (trimPrefix "v" $knativeVersion) "" | quote }}
  {{- if $isOpencsgRegistry }}
  registry:
    override:
      activator: {{ $knativeRegistry }}/serving/cmd/activator:{{ $knativeVersion }}
      autoscaler: {{ $knativeRegistry }}/serving/cmd/autoscaler:{{ $knativeVersion }}
      controller: {{ $knativeRegistry }}/serving/cmd/controller:{{ $knativeVersion }}
      webhook: {{ $knativeRegistry }}/serving/cmd/webhook:{{ $knativeVersion }}
      autoscaler-hpa: {{ $knativeRegistry }}/serving/cmd/autoscaler-hpa:{{ $knativeVersion }}
      cleanup: {{ $knativeRegistry }}/serving/pkg/cleanup/cmd/cleanup:{{ $knativeVersion }}
      migrate: {{ $knativeRegistry }}/pkg/apiextensions/storageversion/cmd/migrate:{{ $knativeVersion }}
      queue-proxy: {{ $knativeRegistry }}/serving/cmd/queue:{{ $knativeVersion }}
      {{- if $gatewayAPI }}
      net-gateway-api-controller/controller: {{ $knativeRegistry }}/net-gateway-api/cmd/controller:{{ $knativeVersion }}
      net-gateway-api-webhook/webhook: {{ $knativeRegistry }}/net-gateway-api/cmd/webhook:{{ $knativeVersion }}
      {{- else }}
      net-kourier-controller/controller: {{ $knativeRegistry }}/net-kourier/cmd/kourier:{{ $knativeVersion }}
      3scale-kourier-gateway/kourier-gateway: {{ .Values.global.image.registry }}/opencsghq/envoyproxy/envoy:v1.37-latest
      {{- end }}
  {{- end }}
  ingress:
    {{- if $gatewayAPI }}
    kourier:
      enabled: false
    gateway-api:
      enabled: true
    {{- else }}
    kourier:
      enabled: true
    {{- end }}
    istio:
      enabled: false
  config:
    {{- /* Computed defaults are injected only when the user hasn't set them,
       so a values-driven override always wins. */ -}}
    {{- $globalRegistry := .Values.global.image.registry | default "" }}
    {{- $privateRegistry := .Values.externalUrl | trimPrefix "https://" | trimPrefix "http://" }}
    {{- $registryList := list (include "common.domain.csghub" .) $privateRegistry $globalRegistry | sortAlpha | uniq }}
    {{- $ingressClass := ternary "gateway-api.ingress.networking.knative.dev" "kourier.ingress.networking.knative.dev" $gatewayAPI }}
    {{- $defaults := dict
          "deployment" (dict "registries-skipping-tag-resolving" (join "," $registryList))
          "network" (dict "ingress-class" $ingressClass) }}
    {{- if $isOpencsgRegistry }}
    {{- $_ := set (get $defaults "deployment") "queue-sidecar-image" (printf "%s/serving/cmd/queue:%s" $knativeRegistry $knativeVersion) }}
    {{- end }}
    {{- if $gatewayAPI }}
    {{- $_ := set $defaults "gateway" (dict
          "external-gateways" (toYaml (list (dict
                "class" "eg-external"
                "gateway" (printf "%s/knative" .Release.Namespace)
                "supported-features" (list "HTTPRouteRequestTimeout"))))
          "local-gateways" (toYaml (list (dict
                "class" "eg-internal"
                "gateway" (printf "%s/knative-local" .Release.Namespace)
                "supported-features" (list "HTTPRouteRequestTimeout"))))
    ) }}
    {{- end }}
    {{- $userConfig := deepCopy ($service.knative.serving.config | default dict) }}
    {{- toYaml (merge $userConfig $defaults) | nindent 4 }}
